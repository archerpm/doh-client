# deb + rpm for the GTK4 / WebKitGTK 6.0 build (Ubuntu 24.04+, Debian 13+, Fedora 40+).
# Built by CI with: BIN=<binary> VERSION=<x.y.z> nfpm package -f packaging/linux/nfpm-gtk4.yaml -p deb|rpm
name: doh-client
arch: amd64
platform: linux
version: ${VERSION}
section: net
priority: optional
maintainer: Archer <noreply@users.noreply.github.com>
description: |
  DoH Client: local DNS-over-HTTPS resolver for bypassing geo-blocks.
  One DoH provider chosen by the user; GUI plus a system service.
homepage: https://github.com/archerpm/doh-client
license: MIT
conflicts:
  - doh-client-gtk3
contents:
  - src: ${BIN}
    dst: /usr/bin/doh-client
    file_info:
      mode: 0755
  - src: packaging/linux/doh-client.desktop
    dst: /usr/share/applications/doh-client.desktop
  - src: internal/svc/assets/doh-client.png
    dst: /usr/share/icons/hicolor/256x256/apps/doh-client.png
  - src: LICENSE
    dst: /usr/share/doc/doh-client/LICENSE
scripts:
  postinstall: packaging/linux/postinst.sh
  preremove: packaging/linux/prerm.sh
overrides:
  deb:
    depends:
      - libgtk-4-1
      - libwebkitgtk-6.0-4
  rpm:
    depends:
      - gtk4
      - webkitgtk6.0
