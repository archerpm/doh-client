name: debian

# Builds and smoke-tests the Linux binary inside Debian containers.
# A container has no systemd and no real network DNS settings, so this checks the
# build, the unit tests and the daemon with its local API; the service install
# and the DNS switch need a real machine.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  debian:
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: debian:12
            deps: libgtk-3-dev libwebkit2gtk-4.1-dev
            flavor: gtk3
          - image: debian:13
            deps: libgtk-4-dev libwebkitgtk-6.0-dev
            flavor: ""
    runs-on: ubuntu-latest
    container: ${{ matrix.image }}
    steps:
      - name: System packages
        run: |
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates git curl tar build-essential pkg-config xvfb xauth ${{ matrix.deps }}
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Trust the checkout (the container runs as another user than the files' owner)
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Test
        run: |
          TAGS=""; [ -n "${{ matrix.flavor }}" ] && TAGS="-tags ${{ matrix.flavor }}"
          go vet $TAGS ./...
          go test $TAGS ./...
      - name: Build
        run: bash scripts/build-linux.sh ${{ matrix.flavor }}
      - name: Version
        run: |
          BIN=$(ls dist/doh-client-linux-*)
          echo "$BIN"; "$BIN" version
          ldd "$BIN" | grep -i "not found" && exit 1 || true
      - name: Daemon and local API
        run: |
          BIN=$(realpath dist/doh-client-linux-*)
          export DOH_CLIENT_STATE_DIR=/tmp/doh-state
          mkdir -p "$DOH_CLIENT_STATE_DIR"
          "$BIN" run > /tmp/doh.log 2>&1 &
          for i in $(seq 1 20); do "$BIN" status --json > /tmp/status.json 2>/dev/null && break; sleep 1; done
          cat /tmp/status.json
          grep -q '"version"' /tmp/status.json
          "$BIN" test example.com
          kill %1 || true
          echo "--- daemon log"; cat /tmp/doh.log
      - name: GUI starts under Xvfb (informational)
        continue-on-error: true
        run: |
          BIN=$(realpath dist/doh-client-linux-*)
          export DOH_CLIENT_STATE_DIR=/tmp/doh-state
          set +e
          xvfb-run -a timeout 10 "$BIN" > /tmp/gui.log 2>&1
          code=$?
          echo "exit code: $code (124 = still running after 10 s, i.e. started)"
          cat /tmp/gui.log
          [ "$code" = 124 ]
