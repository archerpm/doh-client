name: build

# Every push and pull request is built and tested on all three systems.
# A tag like v1.1.0 additionally publishes the builds as a GitHub Release.
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Test
        shell: pwsh
        run: |
          if (gofmt -l .) { gofmt -l .; throw "gofmt" }
          go vet ./...
          go test ./...
      - name: Build
        shell: pwsh
        run: ./scripts/build-windows.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/doh-client-windows-*.exe

  linux:
    strategy:
      fail-fast: false
      matrix:
        include:
          # GTK4 / WebKitGTK 6.0: Ubuntu 24.04+, Fedora 40+
          - runner: ubuntu-24.04
            deps: libgtk-4-dev libwebkitgtk-6.0-dev
            flavor: ""
            name: linux-gtk4
          # GTK3 / WebKit2GTK 4.1: Ubuntu 22.04, Debian 12 (built on 22.04 for its older glibc)
          - runner: ubuntu-22.04
            deps: libgtk-3-dev libwebkit2gtk-4.1-dev
            flavor: gtk3
            name: linux-gtk3
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: System packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential pkg-config ${{ matrix.deps }}
      - name: Test
        run: |
          test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
          TAGS=""; [ -n "${{ matrix.flavor }}" ] && TAGS="-tags ${{ matrix.flavor }}"
          go vet $TAGS ./...
          go test $TAGS ./...
      - name: Build
        run: ./scripts/build-linux.sh ${{ matrix.flavor }}
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: dist/doh-client-linux-*

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Test
        run: |
          test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
          go vet ./...
          go test ./...
      - name: Build
        run: ./scripts/build-macos.sh
      - name: Pack
        run: ditto -c -k --keepParent "dist/DoH Client.app" dist/DoH-Client-macos.zip
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: dist/DoH-Client-macos.zip

  packages:
    needs: [linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/download-artifact@v4
        with:
          name: linux-gtk4
          path: bin/gtk4
      - uses: actions/download-artifact@v4
        with:
          name: linux-gtk3
          path: bin/gtk3
      - name: Install nfpm
        run: go install github.com/goreleaser/nfpm/v2/cmd/nfpm@v2.46.3
      - name: Build deb and rpm
        run: |
          VERSION=$(grep -oP 'var version = "\K[^"]+' main.go); export VERSION
          mkdir -p pkg
          for v in gtk4 gtk3; do
            if [ "$v" = gtk4 ]; then BIN=bin/gtk4/doh-client-linux-amd64; else BIN=bin/gtk3/doh-client-linux-amd64-gtk3; fi
            export BIN
            for f in deb rpm; do "$(go env GOPATH)/bin/nfpm" package -f "packaging/linux/nfpm-$v.yaml" -p "$f" -t pkg/; done
          done
          ls -la pkg
      - uses: actions/upload-artifact@v4
        with:
          name: packages
          path: pkg/*

  # Real Ubuntu VMs have systemd, so the service itself is installed and removed here.
  packages-test-host:
    needs: [packages]
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            pkg: doh-client
          - runner: ubuntu-22.04
            pkg: doh-client-gtk3
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: packages
          path: pkg
      - name: Install
        run: |
          sudo apt-get update
          sudo apt-get install -y ./pkg/${{ matrix.pkg }}_*_amd64.deb
          doh-client version
          test -x /usr/bin/doh-client
          if ldd /usr/bin/doh-client | grep "not found"; then exit 1; fi
      - name: Service install, status, API
        run: |
          sudo doh-client service install --owner "$(id -u)"
          sleep 5
          doh-client service status
          systemctl is-active doh-client
          doh-client status --json | head -20
      - name: Remove restores everything
        run: |
          sudo apt-get remove -y ${{ matrix.pkg }}
          test ! -e /usr/bin/doh-client
          test ! -e /usr/local/lib/doh-client/doh-client
          if systemctl is-active --quiet doh-client; then echo "service still active"; exit 1; fi
          cat /etc/resolv.conf

  # Containers have no systemd: install, dependency resolution and removal only.
  packages-test-container:
    needs: [packages]
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: debian:13
            install: apt-get update && apt-get install -y ./pkg/doh-client_*_amd64.deb
            remove: apt-get remove -y doh-client
          - image: debian:12
            install: apt-get update && apt-get install -y ./pkg/doh-client-gtk3_*_amd64.deb
            remove: apt-get remove -y doh-client-gtk3
          - image: fedora:42
            install: dnf install -y ./pkg/doh-client-[0-9]*.x86_64.rpm
            remove: dnf remove -y doh-client
          - image: fedora:42
            install: dnf install -y ./pkg/doh-client-gtk3-*.x86_64.rpm
            remove: dnf remove -y doh-client-gtk3
    runs-on: ubuntu-latest
    container: ${{ matrix.image }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: packages
          path: pkg
      - name: Install
        run: |
          ${{ matrix.install }}
          doh-client version
          if ldd /usr/bin/doh-client | grep "not found"; then exit 1; fi
      - name: Remove
        run: |
          ${{ matrix.remove }}
          test ! -e /usr/bin/doh-client

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, linux, macos, packages, packages-test-host, packages-test-container]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - name: Checksums
        run: cd out && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt
      - uses: softprops/action-gh-release@v2
        with:
          files: out/*
          generate_release_notes: true
